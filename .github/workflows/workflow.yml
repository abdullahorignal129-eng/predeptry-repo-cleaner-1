name: Test GraphQL Scraper (3 Tokens)

on:
  workflow_dispatch: {} # Manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 1 hour timeout for the test run
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install aiohttp

      - name: Run GraphQL Worker
        env:
          # Pass your 3 test tokens here, comma-separated
          GITHUB_TOKENS: ${{ secrets.GH_TOKENS }}
          # Your HF Space URL
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: python worker.py
