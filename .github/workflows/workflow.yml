name: Test GraphQL Scraper (3 Tokens)
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable verbose debug logging'
        required: false
        default: 'true'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # shorter timeout for a debug test run — bump back up once it's working
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install aiohttp

      - name: Sanity-check secrets are set
        run: |
          if [ -z "${{ secrets.GH_TOKENS }}" ]; then
            echo "::error::GH_TOKENS secret is empty or not set"
            exit 1
          fi
          if [ -z "${{ secrets.HF_SPACE_URL }}" ]; then
            echo "::error::HF_SPACE_URL secret is empty or not set"
            exit 1
          fi
          echo "Secrets are present (values hidden)."

      - name: Test one token against GitHub GraphQL directly
        env:
          GH_TOKENS: ${{ secrets.GH_TOKENS }}
        run: |
          FIRST_TOKEN=$(echo "$GH_TOKENS" | cut -d',' -f1 | xargs)
          echo "Testing first token's auth + scopes against GitHub API..."
          curl -s -o /tmp/token_test.json -w "HTTP Status: %{http_code}\n" \
            -H "Authorization: Bearer $FIRST_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.github.com/graphql \
            -d '{"query":"query { viewer { login } rateLimit { limit remaining used resetAt } }"}'
          echo "Response body:"
          cat /tmp/token_test.json
          echo ""
          echo "If you see a 'login' field above, the token works and has at least basic GraphQL access."
          echo "If you see an 'errors' array instead, that's your root cause — check token scopes (needs 'repo' or 'public_repo')."

      - name: Run GraphQL Worker
        env:
          GITHUB_TOKENS: ${{ secrets.GH_TOKENS }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python worker.py

      - name: Show job summary
        if: always()
        run: |
          echo "### Run finished" >> $GITHUB_STEP_SUMMARY
          echo "Check the 'Run GraphQL Worker' step logs above for the 'Sample error:' line" >> $GITHUB_STEP_SUMMARY
          echo "and the 'GraphQL errors on batch:' lines to see the real failure reason." >> $GITHUB_STEP_SUMMARY
